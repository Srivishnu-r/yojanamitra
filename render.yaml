services:
  - type: web
    name: yojanamitra
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: FORCE_DEMO_MODE
        value: "1"
      - key: SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
